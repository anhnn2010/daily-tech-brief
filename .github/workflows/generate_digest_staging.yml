name: Generate Daily Tech Brief - Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-tech-brief-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  generate:
    name: Validate, test, and generate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Show runtime information
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate configuration
        run: python -m src.main --validate-only

      - name: Run tests
        run: python -m pytest -q

      - name: Generate digest
        run: python -m src.main

      - name: List generated outputs
        run: |
          echo "Generated files:"
          find output -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload staging artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-tech-brief-staging-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
