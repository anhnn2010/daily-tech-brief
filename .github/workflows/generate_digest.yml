name: Generate Daily Tech Brief

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

  schedule:
    # 04:30 in Asia/Ho_Chi_Minh (UTC+7)
    - cron: "30 21 * * *"

concurrency:
  group: >-
    daily-tech-brief-${{
      github.event_name == 'schedule'
      && 'production'
      || inputs.environment
      || 'staging'
    }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  generate:
    name: >-
      Generate (${{
        github.event_name == 'schedule'
        && 'production'
        || inputs.environment
        || 'staging'
      }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      actions: read

    environment: >-
      ${{
        github.event_name == 'schedule'
        && 'production'
        || inputs.environment
        || 'staging'
      }}

    outputs:
      target_environment: ${{ steps.target.outputs.environment }}
      pages_artifact_name: ${{ steps.target.outputs.pages_artifact_name }}

    steps:
      - name: Resolve target environment
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            target_environment="production"
          else
            target_environment="${{ inputs.environment }}"
          fi

          pages_artifact_name="github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "TARGET_ENVIRONMENT=${target_environment}" >> "${GITHUB_ENV}"
          echo "environment=${target_environment}" >> "${GITHUB_OUTPUT}"
          echo "pages_artifact_name=${pages_artifact_name}" >> "${GITHUB_OUTPUT}"

          echo "Target environment: ${target_environment}"
          echo "Pages artifact: ${pages_artifact_name}"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Show runtime information
        run: |
          python --version
          python -m pip --version
          echo "Environment: ${TARGET_ENVIRONMENT}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate configuration
        run: python -m src.main --validate-only

      - name: Run tests
        run: python -m pytest -q

      - name: Restore previous production site
        if: env.TARGET_ENVIRONMENT == 'production'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_record="$(
            gh api \
              --paginate \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '
                .artifacts[]
                | select(
                    .expired == false
                    and (
                      .name
                      | startswith(
                          "daily-tech-brief-site-production-"
                        )
                    )
                  )
                | [.created_at, (.id | tostring), .name]
                | @tsv
              ' \
              | sort -r \
              | head -n 1
          )"

          if [[ -z "${artifact_record}" ]]; then
            echo "No previous production site artifact found."
            exit 0
          fi

          artifact_id="$(cut -f2 <<< "${artifact_record}")"
          artifact_name="$(cut -f3 <<< "${artifact_record}")"

          echo "Restoring archive from: ${artifact_name}"

          gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > "${RUNNER_TEMP}/previous-site.zip"

          mkdir -p site
          unzip -q "${RUNNER_TEMP}/previous-site.zip" -d site

          echo "Restored archive files:"
          find site/archive -type f -printf '%P\n' 2>/dev/null \
            | sort \
            | head -n 30 \
            || true

      - name: Generate digest and static site
        run: python -m src.main

      - name: Verify EPUB publication
        shell: bash
        run: |
          test -s output/digest.epub
          test -s output/digest-full.epub
          test -s site/digest.epub
          test -s site/latest/digest.epub
          test -s site/digest-full.epub
          test -s site/latest/digest-full.epub

          archive_epub="$(
            find site/archive \
              -type f \
              -path '*/digest.epub' \
              -exec cmp -s output/digest.epub {} \; \
              -print \
              -quit
          )"
          archive_full_epub="$(
            find site/archive \
              -type f \
              -path '*/digest-full.epub' \
              -exec cmp -s output/digest-full.epub {} \; \
              -print \
              -quit
          )"

          if [[ -z "${archive_epub}" ]]; then
            echo "No archived summary EPUB was generated." >&2
            exit 1
          fi
          if [[ -z "${archive_full_epub}" ]]; then
            echo "No archived full EPUB was generated." >&2
            exit 1
          fi

          cmp output/digest.epub site/digest.epub
          cmp output/digest.epub site/latest/digest.epub
          cmp output/digest.epub "${archive_epub}"

          cmp output/digest-full.epub site/digest-full.epub
          cmp output/digest-full.epub site/latest/digest-full.epub
          cmp output/digest-full.epub "${archive_full_epub}"

          grep -q 'href="digest-full.epub"' site/index.html
          grep -q 'Download EPUB' site/index.html

          echo "Verified summary EPUB: ${archive_epub}"
          echo "Verified full EPUB: ${archive_full_epub}"

      - name: Verify OPDS catalog
        shell: bash
        run: |
          test -s site/opds/catalog.xml

          opds_date="$(
            python - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(
              Path("site/site.json").read_text(encoding="utf-8")
          )
          archive_date = metadata.get("archive_date")
          if not isinstance(archive_date, str) or not archive_date:
              raise SystemExit("site.json archive_date is missing")
          print(archive_date)
          PY
          )"
          opds_book="site/opds/books/daily-tech-brief-${opds_date}.epub"

          test -s "${opds_book}"
          cmp output/digest-full.epub "${opds_book}"

          python - "${opds_date}" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          edition_date = sys.argv[1]
          catalog_path = Path("site/opds/catalog.xml")
          root = ET.parse(catalog_path).getroot()
          atom = "{http://www.w3.org/2005/Atom}"

          if root.tag != f"{atom}feed":
              raise SystemExit("OPDS catalog is not an Atom feed")

          expected_href = (
              "books/"
              f"daily-tech-brief-{edition_date}.epub"
          )
          matches = []
          for entry in root.findall(f"{atom}entry"):
              for link in entry.findall(f"{atom}link"):
                  if (
                      link.get("rel")
                      == "http://opds-spec.org/acquisition"
                      and link.get("href") == expected_href
                  ):
                      matches.append(link)

          if len(matches) != 1:
              raise SystemExit(
                  "Latest OPDS acquisition entry was not found"
              )
          if matches[0].get("type") != "application/epub+zip":
              raise SystemExit(
                  "Latest OPDS entry has an invalid media type"
              )
          PY

          echo "Verified OPDS catalog: site/opds/catalog.xml"
          echo "Verified OPDS book: ${opds_book}"

      - name: Verify Technical Learning output
        run: |
          python scripts/verify_technical_learning.py \
            --expected-total 20 \
            --expected-learning 1

      - name: Publish full-content report
        if: always()
        shell: bash
        run: |
          if [[ ! -s output/ranked_articles.json ]]; then
            {
              echo "## Full-content EPUB"
              echo
              echo "Report unavailable because output/ranked_articles.json was not generated."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          python scripts/report_content_enrichment.py \
            --markdown \
            --problems-only \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish Technical Learning coverage
        if: always()
        shell: bash
        run: |
          if [[ ! -s config/learning_library.yml ]]; then
            {
              echo "## Technical Learning coverage"
              echo
              echo "Report unavailable because config/learning_library.yml was not found."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          coverage_report="${RUNNER_TEMP}/technical-learning-coverage.md"

          if python scripts/report_learning_coverage.py \
            --markdown \
            --uncurated-only \
            > "${coverage_report}"; then
            cat "${coverage_report}" >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "## Technical Learning coverage"
              echo
              echo "Coverage report could not be generated."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: List generated outputs
        run: |
          echo "Generated output files:"
          find output -maxdepth 1 -type f -printf '%f\n' | sort

          echo
          echo "Generated site files:"
          find site -type f -printf '%P\n' | sort

      - name: Upload digest output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            daily-tech-brief-${{
              env.TARGET_ENVIRONMENT
            }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload static site artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            daily-tech-brief-site-${{
              env.TARGET_ENVIRONMENT
            }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: site/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Upload GitHub Pages artifact
        if: env.TARGET_ENVIRONMENT == 'production'
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.target.outputs.pages_artifact_name }}
          path: site/
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Deploy GitHub Pages
    needs: generate
    if: needs.generate.outputs.target_environment == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.generate.outputs.pages_artifact_name }}
