name: Generate Daily Tech Brief

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

  schedule:
    # 06:30 in Asia/Ho_Chi_Minh (UTC+7)
    - cron: "30 23 * * *"

concurrency:
  group: >-
    daily-tech-brief-${{
      github.event_name == 'schedule'
      && 'production'
      || inputs.environment
      || 'staging'
    }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  generate:
    name: >-
      Generate (${{
        github.event_name == 'schedule'
        && 'production'
        || inputs.environment
        || 'staging'
      }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      actions: read

    environment: >-
      ${{
        github.event_name == 'schedule'
        && 'production'
        || inputs.environment
        || 'staging'
      }}

    outputs:
      target_environment: ${{ steps.target.outputs.environment }}
      pages_artifact_name: ${{ steps.target.outputs.pages_artifact_name }}

    steps:
      - name: Resolve target environment
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            target_environment="production"
          else
            target_environment="${{ inputs.environment }}"
          fi

          pages_artifact_name="github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "TARGET_ENVIRONMENT=${target_environment}" >> "${GITHUB_ENV}"
          echo "environment=${target_environment}" >> "${GITHUB_OUTPUT}"
          echo "pages_artifact_name=${pages_artifact_name}" >> "${GITHUB_OUTPUT}"

          echo "Target environment: ${target_environment}"
          echo "Pages artifact: ${pages_artifact_name}"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Show runtime information
        run: |
          python --version
          python -m pip --version
          echo "Environment: ${TARGET_ENVIRONMENT}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate configuration
        run: python -m src.main --validate-only

      - name: Run tests
        run: python -m pytest -q

      - name: Restore previous production site
        if: env.TARGET_ENVIRONMENT == 'production'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_record="$(
            gh api \
              --paginate \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '
                .artifacts[]
                | select(
                    .expired == false
                    and (
                      .name
                      | startswith(
                          "daily-tech-brief-site-production-"
                        )
                    )
                  )
                | [.created_at, (.id | tostring), .name]
                | @tsv
              ' \
              | sort -r \
              | head -n 1
          )"

          if [[ -z "${artifact_record}" ]]; then
            echo "No previous production site artifact found."
            exit 0
          fi

          artifact_id="$(cut -f2 <<< "${artifact_record}")"
          artifact_name="$(cut -f3 <<< "${artifact_record}")"

          echo "Restoring archive from: ${artifact_name}"

          gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > "${RUNNER_TEMP}/previous-site.zip"

          mkdir -p site
          unzip -q "${RUNNER_TEMP}/previous-site.zip" -d site

          echo "Restored archive files:"
          find site/archive -type f -printf '%P\n' 2>/dev/null \
            | sort \
            | head -n 30 \
            || true

      - name: Generate digest and static site
        run: python -m src.main

      - name: List generated outputs
        run: |
          echo "Generated output files:"
          find output -maxdepth 1 -type f -printf '%f\n' | sort

          echo
          echo "Generated site files:"
          find site -type f -printf '%P\n' | sort

      - name: Upload digest output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            daily-tech-brief-${{
              env.TARGET_ENVIRONMENT
            }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload static site artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            daily-tech-brief-site-${{
              env.TARGET_ENVIRONMENT
            }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: site/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Upload GitHub Pages artifact
        if: env.TARGET_ENVIRONMENT == 'production'
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.target.outputs.pages_artifact_name }}
          path: site/
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Deploy GitHub Pages
    needs: generate
    if: needs.generate.outputs.target_environment == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.generate.outputs.pages_artifact_name }}
