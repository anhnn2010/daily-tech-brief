name: Generate Daily Tech Brief

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

  schedule:
    # 06:30 in Asia/Ho_Chi_Minh (UTC+7)
    - cron: "30 23 * * *"

permissions:
  contents: read

concurrency:
  group: >-
    daily-tech-brief-${{
      github.event_name == 'schedule'
      && 'production'
      || inputs.environment
      || 'staging'
    }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  generate:
    name: >-
      Generate (${{
        github.event_name == 'schedule'
        && 'production'
        || inputs.environment
        || 'staging'
      }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    environment: >-
      ${{
        github.event_name == 'schedule'
        && 'production'
        || inputs.environment
        || 'staging'
      }}

    steps:
      - name: Resolve target environment
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            target_environment="production"
          else
            target_environment="${{ inputs.environment }}"
          fi

          echo "TARGET_ENVIRONMENT=${target_environment}" >> "${GITHUB_ENV}"
          echo "Target environment: ${target_environment}"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Show runtime information
        run: |
          python --version
          python -m pip --version
          echo "Environment: ${TARGET_ENVIRONMENT}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate configuration
        run: python -m src.main --validate-only

      - name: Run tests
        run: python -m pytest -q

      - name: Generate digest and static site
        run: python -m src.main

      - name: List generated outputs
        run: |
          echo "Generated output files:"
          find output -maxdepth 1 -type f -printf '%f\n' | sort

          echo
          echo "Generated site files:"
          find site -type f -printf '%P\n' | sort

      - name: Upload digest output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            daily-tech-brief-${{
              env.TARGET_ENVIRONMENT
            }}-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload static site artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            daily-tech-brief-site-${{
              env.TARGET_ENVIRONMENT
            }}-${{ github.run_number }}
          path: site/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
