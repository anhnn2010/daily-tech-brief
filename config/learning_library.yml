  track: analog_foundations
  topics:
  - bandgap_reference
  - ptat
  - ctat
  - temperature
  - voltage_reference
  difficulty: intermediate
  estimated_minutes: 20
  summary: 'Explains how PTAT and CTAT behavior are combined to generate a temperature-stable reference
